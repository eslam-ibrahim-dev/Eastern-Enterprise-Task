security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: plaintext

    providers:
        in_memory:
            memory:
                users:
                    admin:
                        password: 'admin'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: in_memory
            http_basic:
                realm: 'Country API'
            stateless: true

    access_control:
        - { path: ^/api/v1/countries, methods: [POST, PATCH, DELETE], roles: ROLE_ADMIN }
        - { path: ^/api, roles: PUBLIC_ACCESS }
